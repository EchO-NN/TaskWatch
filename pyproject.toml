[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "taskwatch"
version = "0.1.0"
description = "Efficient video-based subtask completion verification for embodied agents"
requires-python = ">=3.11,<3.13"
dependencies = [
  "einops>=0.8",
  "matplotlib>=3.9",
  "numpy>=1.26,<3",
  "pillow>=10",
  "protobuf==6.33.5",
  "pyyaml>=6",
  "safetensors>=0.5",
  "tensorflow-cpu>=2.20,<2.21",
  "tensorflow-datasets>=4.9,<5",
  "googleapis-common-protos==1.72.0",
  "timm>=1.0",
  "torch==2.7.1",
  "torchvision==0.22.1",
  "tqdm>=4.66",
  "transformers==5.9.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.9"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "integration: requires real checkpoints or DROID RLDS",
  "distributed: requires torchrun with at least two processes",
]

[tool.ruff]
line-length = 100
target-version = "py311"
